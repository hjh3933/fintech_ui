<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>graph</title>
    <style>
      /* reset */
      html {
        font-size: 18px;
        line-height: 1.4;
      }
      body {
        border: 2px dashed red;
        margin: 0px;
        padding: 10px;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size: 1em;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      div,
      p,
      dl,
      dt,
      dd,
      ul,
      ol,
      li,
      form,
      fieldset,
      blockquote,
      address,
      table,
      thead,
      tbody,
      tfoot,
      tr,
      td,
      caption {
        margin: 0;
        padding: 0;
      }
      li {
        list-style: none;
      }

      /* graph */
      .box {
        border: 2px solid black;
        box-sizing: border-box;
        width: 500px;
        /* width: 456px; */
        background-color: lightgray;
        padding: 20px;
      }
      .box > div {
        /* height: 35px;
        padding-top: 8px; */
        line-height: 35px;
        text-align: right;
        &:not(:last-of-type) {
          margin-bottom: 15px;
        }
        box-sizing: border-box;
        padding-right: 10px;
      }
      .box > div > strong {
        color: white;
        /* border: 1px solid white; */
      }
      .bar1 {
        width: 100%;
        background-color: red;
      }
      .bar2 {
        width: 75%;
        background-color: lime;
      }
      .bar3 {
        width: 54%;
        background-color: brown;
      }
      .bar4 {
        width: 64%;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="bar1"><strong>1위</strong><span>100%</span></div>
      <div class="bar2"><strong>2위</strong><span>75%</span></div>
      <div class="bar3"><strong>4위</strong><span>54%</span></div>
      <div class="bar4"><strong>3위</strong><span>64%</span></div>
    </div>
  </body>
</html>
